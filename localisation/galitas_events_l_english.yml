l_english:
 gal_kktb_collapse.1.t: "The end of the world"
 gal_kktb_collapse.1.d: "The Guarddom is unsubstainable and the failed crussades turned the military state weak. The Holy guard is whoring in the capital whilst the populus and noblety rebell and sack the same towns they sworn to protect. Independence and destruction cover the old lands of Klakateba, and the holy guardian holds no power anymore. There's an emperor in every corner, but who will rule over the sacred Xi, and the lesser Gi?"
 gal_kktb_collapse.2.d: "You flee into central klakateba entering a land full of core/family disputes and guarddom remnants!"
 gal_kktb_collapse.3.d: "You go further south into Gí territory, peasants rule and misticism is the force of reason for some leaders. Unorganized tribes still linger throught the woods with no one to stop them. Years of opression and aparthaid have left the people with a spirit of rebellion and discomfort."
 kktb_coll.1: "Play as:"
 kktb_coll.2: "Next (can't go back!)"
 Flavour_KKTB.1.t: "Avalanche !!!"
 Flavour_KKTB.1.d: "My lord! The farmers in <province> send us letters of desastrous damages to crops and farm houses caused by a massive avalanche, what should we do!?"
 Flavour_KKTB.1.op: "there is nothing we can do against the forces of nature"


